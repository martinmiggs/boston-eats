<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Restaurant List — Preview</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --text-secondary: #555;
      --accent: #e63946;
      --accent-light: #ffd6d9;
      --border: #e0e0e0;
      --rating-bg: #fff3cd;
      --tag-bg: #e8f4f8;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    header { background: var(--card-bg); padding: 20px 16px; text-align: center; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    #subtitle { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
    main { padding: 12px; max-width: 600px; margin: 0 auto; }
    .restaurant-card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); cursor: pointer; border: 1px solid var(--border); }
    .restaurant-card:active { transform: scale(0.98); }
    .restaurant-card .name { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
    .restaurant-card .cuisine { font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
    .restaurant-card .address { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; }
    .restaurant-card .meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .rating { background: var(--rating-bg); color: #856404; font-size: 0.8rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
    .review-count { font-size: 0.8rem; color: var(--text-secondary); }
    .phone { font-size: 0.8rem; color: var(--text-secondary); }
    .user-note { background: var(--tag-bg); color: #0c5460; font-size: 0.8rem; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
    .detail-view { background: var(--card-bg); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .detail-header h2 { font-size: 1.2rem; font-weight: 700; flex: 1; }
    .back-btn { background: var(--accent); color: white; border: none; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-left: 10px; }
    .detail-info { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .detail-info p { font-size: 0.9rem; margin-bottom: 6px; }
    .detail-info .label { font-weight: 600; }
    .detail-info .value { color: var(--text-secondary); }
    .hours-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 0.85rem; margin-bottom: 12px; }
    .hours-grid .day { font-weight: 600; }
    .hours-grid .time { color: var(--text-secondary); }
    .hours-grid .closed { color: var(--accent); font-weight: 600; }
    .user-note-detail { background: var(--tag-bg); border-left: 3px solid #0c5460; padding: 10px 14px; border-radius: 0 8px 8px 0; margin-bottom: 16px; font-size: 0.9rem; color: #0c5460; }
    .map-link { display: inline-block; background: var(--accent); color: white; text-decoration: none; padding: 10px 20px; border-radius: 25px; font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; text-align: center; width: 100%; }
    .menu-section { margin-bottom: 20px; }
    .menu-section-title { font-size: 1rem; font-weight: 700; color: var(--accent); padding-bottom: 6px; border-bottom: 2px solid var(--accent-light); margin-bottom: 10px; }
    .menu-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .menu-item:last-child { border-bottom: none; }
    .menu-item-header { display: flex; justify-content: space-between; align-items: baseline; }
    .menu-item-name { font-weight: 600; font-size: 0.95rem; flex: 1; }
    .menu-item-price { font-weight: 700; font-size: 0.9rem; color: var(--accent); white-space: nowrap; margin-left: 12px; }
    .menu-item-notes { font-size: 0.82rem; color: var(--text-secondary); margin-top: 3px; font-style: italic; }
    .restaurant-notes { background: var(--tag-bg); padding: 12px 14px; border-radius: 8px; font-size: 0.9rem; color: #0c5460; margin-bottom: 16px; }
    .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
  </style>
</head>
<body>

    <h1>My Restaurant List</h1>
    <p id="subtitle">Tap a restaurant to view details</p>
  </header>
  <main id="app"></main>
  <script>

      },

      {

        cuisine: "Modern Indian",
        rating: 4.7,

        hours: { Mon: "Closed", Tue: "4:00 PM - 9:30 PM", Wed: "4:00 PM - 9:30 PM", Thu: "4:00 PM - 9:30 PM", Fri: "4:00 PM - 9:30 PM", Sat: "4:00 PM - 9:30 PM", Sun: "4:00 PM - 8:00 PM" },
        notes: "",
        maps_url: "https://www.google.com/maps/search/?query=Aatma+At+Widowmaker+190+N+Beacon+St+Brighton+MA+02135",
        menu: {
          Signature: [
            { name: "The Aatma Burger", price: 20.00, notes: "Two masala-spiced halal beef patties, Aatma sauce, achari onions, Amul cheese. With Chaat-er Tots. GF upon request +$1" },

          ],
          "Street Food": [
            { name: "Fried Idli Chaat", price: 15.00, notes: "Fried idlis, hand-ground dried chiles, tamarind-ginger chutney, yogurt, cilantro" },
            { name: "Widowmaker Bhajji's", notes: "Indian fritters" }
          ],
          Kebabs: [
            { name: "Lamb Seekh Kebab" }
          ],
          Dosa: [
            { name: "Benne Dosa", notes: "Fermented rice/lentil batter, blistered in butter, stuffed with spiced potato" }
          ],
          Sides: [
            { name: "Naan", price_range: "$4 - $6" },
            { name: "Rice", price_range: "$5 - $8" }
          ],
          Beverages: [
            { name: "Masala Chai", price: 6.00, notes: "House-made, oat milk, toasted spices" },
            { name: "Mango Lassi", price: 9.00, notes: "Rose syrup, creamy, tart, floral" }
          ],
          Notes: "All meat is halal. Counter-service. No reservations. Walk-ins always welcome."
        }
      }
    ];

    const app = document.getElementById('app');

    function esc(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(str));
      return d.innerHTML;
    }

    function renderList() {
      let html = '';
      restaurants.forEach((r, idx) => {
        html += `<div class="restaurant-card" onclick="showDetail(${idx})">`;
        html += `<div class="name">${esc(r.name)}</div>`;
        html += `<div class="cuisine">${esc(r.cuisine)}</div>`;
        html += `<div class="address">${esc(r.address)}</div>`;
        html += `<div class="meta">`;
        html += `<span class="rating">★ ${r.rating}</span>`;
        html += `<span class="review-count">(${r.review_count} reviews)</span>`;
        html += `<span class="phone">${esc(r.phone)}</span>`;
        if (r.notes) html += `<span class="user-note">📝 ${esc(r.notes)}</span>`;
        html += `</div></div>`;
      });
      app.innerHTML = html;
    }

    function showDetail(idx) {
      const r = restaurants[idx];
      let html = '<div class="detail-view">';
      html += `<div class="detail-header"><h2>${esc(r.name)}</h2><button class="back-btn" onclick="renderList()">← Back</button></div>`;
      html += `<div class="detail-info">`;
      html += `<p><span class="label">Address:</span> <span class="value">${esc(r.address)}</span></p>`;
      html += `<p><span class="label">Phone:</span> <span class="value"><a href="tel:${r.phone.replace(/\s/g,'')}">${esc(r.phone)}</a></span></p>`;
      html += `<p><span class="label">Rating:</span> <span class="value">★ ${r.rating} (${r.review_count} reviews)</span></p>`;
      html += `<p><span class="label">Cuisine:</span> <span class="value">${esc(r.cuisine)}</span></p>`;
      html += `</div>`;
      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      html += '<div class="hours-grid">';
      days.forEach(d => {
        const h = r.hours[d];
        html += `<span class="day">${d}</span><span class="value ${h==='Closed'?'closed':''}">${esc(h)}</span>`;
      });
      html += '</div>';
      if (r.notes) html += `<div class="user-note-detail">📝 ${esc(r.notes)}</div>`;
      html += `<a href="${r.maps_url}" class="map-link">📍 Open in Google Maps</a>`;
      for (const [section, items] of Object.entries(r.menu)) {
        if (section === 'Notes') {
          html += `<div class="restaurant-notes">${esc(items)}</div>`;
          continue;
        }
        html += `<div class="menu-section"><div class="menu-section-title">${esc(section)}</div>`;
        if (Array.isArray(items)) {
          items.forEach(item => {
            html += '<div class="menu-item">';
            html += `<div class="menu-item-header"><span class="menu-item-name">${esc(item.name)}</span>`;
            if (item.price) html += `<span class="menu-item-price">$${item.price.toFixed(2)}</span>`;
            if (item.price_range) html += `<span class="menu-item-price">${esc(item.price_range)}</span>`;
            html += '</div>';
            if (item.notes) html += `<div class="menu-item-notes">${esc(item.notes)}</div>`;
            html += '</div>';
          });
        }
        html += '</div>';
      }
      html += '</div>';
      app.innerHTML = html;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.showDetail = showDetail;
    renderList();
  </script>
</body>
</html>
